<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luhn Algoritmo - Liquid Glass Edition (Secure)</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="main-container">
        
        <section class="card-glass">
            <h2 class="section-title">Generador de Dígito Verificador</h2>
            
            <div class="input-row">
                <label for="accountNumber">Ingrese el número para generar<br>el dígito verificador:</label>
                <input type="text" id="accountNumber" value="7992739871" maxlength="30" autocomplete="off">
                <button id="btnGenerate">Generar Dígito<br>Verificador</button>
            </div>

            <div class="table-wrapper">
                <table class="luhn-table">
                    <tr id="rowStep1">
                        <td class="label-cell">1. Digitos del número de cuenta:</td>
                    </tr>
                    <tr id="rowStep2">
                        <td class="label-cell">2. Duplicar dígitos pares:</td>
                    </tr>
                    <tr id="rowStep3">
                        <td class="label-cell">3. Sumar los dígitos:</td>
                    </tr>
                </table>
            </div>

            <div class="result-container">
                <div class="result-label">Dígito<br>Verificador:</div>
                <div id="finalDigit" class="result-box">-</div>
            </div>
        </section>

        <section class="card-glass">
            <h2 class="section-title">Validador de Tarjetas y Series</h2>
            
            <div class="input-row">
                <label for="validateInput">Ingrese el número completo<br>(Con dígito verificador):</label>
                <input type="text" id="validateInput" placeholder="Ej. 52623656415429262" maxlength="40" autocomplete="off">
                <button id="btnValidate" class="btn-validate">Validar Número<br>Existente</button>
            </div>

            <div id="validationResult" class="validation-badge hidden"></div>
        </section>

    </main>

</body>
</html>
